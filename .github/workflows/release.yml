name: Release

# Push a tag like v0.5.0 to build, smoke-test and publish to PyPI.
# PyPI publishing uses trusted publishing (OIDC): no API token is stored in the repo.
# One-time setup on pypi.org: add a trusted publisher for this repository with
# workflow "release.yml" and environment "pypi".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          version=$(uv version --short)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi

      - name: Test
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/ablift --version
          /tmp/smoke/bin/ablift doctor --strict
          /tmp/smoke/bin/ablift analyze --input examples/conversion_multivariant.csv \
            --method sequential > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ablift/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release with changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          flags=()
          # PEP 440 pre-releases (e.g. 0.5.0a1, 1.0.0rc1, 0.6.0.dev1) are marked as such on GitHub.
          if [[ "$version" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            flags+=(--prerelease)
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "Pre-release $version. Install with \`pip install --pre ablift\`. See CHANGELOG.md." > notes.md
            fi
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
            --notes-file notes.md "${flags[@]}"
