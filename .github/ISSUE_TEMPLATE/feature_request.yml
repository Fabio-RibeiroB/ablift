name: Feature request
description: A method, metric, input format or output you need
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to decide or automate, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should ablift do? Include references for any statistical method.
