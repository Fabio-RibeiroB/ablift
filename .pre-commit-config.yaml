repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run --group lint ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: docs-check
        name: docs match the CLI (README, docs/, demo image)
        entry: uv run pytest -q tests/test_docs.py
        language: system
        pass_filenames: false
        files: ^(README\.md|docs/|ablift/cli\.py|ablift/reporting\.py|pyproject\.toml|scripts/render_demo\.py|examples/)
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
