repos:
  # Ruff runs from uv.lock so the hook, `make lint` and CI always use the same version.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ty-check
        name: ty check
        entry: uv run --group lint ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: docs-check
        name: docs match the CLI (README, docs/, demo image)
        entry: uv run pytest -q tests/test_docs.py
        language: system
        pass_filenames: false
        files: ^(README\.md|docs/|ablift/cli\.py|ablift/reporting\.py|pyproject\.toml|scripts/render_demo\.py|examples/)
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: changelog-check
        name: changelog fragment for ablift/ changes (SKIP_CHANGELOG=1 to skip)
        entry: bash scripts/check_changelog_fragment.sh origin/main
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
